<!doctype html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cherry Billiards — Хулан</title>
<meta name="description" content="Хөтөч дээрх биллиардын тоглоом: жинхэнэ мөргөлдөөний физик, чиглэл тааруулах шугам, оноо." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23b3122e'/><circle cx='32' cy='32' r='18' fill='%23111'/><circle cx='32' cy='32' r='8' fill='%23fff'/><text x='32' y='36' font-size='11' text-anchor='middle' font-family='Arial' font-weight='700'>8</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Dela+Gothic+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
<style>
  :root { --paper: #fbf7f0; --ink: #3b2a20; --brown: #8a6a52; --cherry: #b3122e; --f-title: 'Dela Gothic One', 'Nunito', sans-serif; --f-body: 'Nunito', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(1200px 700px at 50% 40%, #3a2a22, #1b1310 70%); color: var(--paper); font: 600 15px/1.4 var(--f-body); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }

  .hud {
    position: fixed; z-index: 3; left: 0; right: 0; top: 0;
    display: flex; align-items: center; gap: 14px; padding: 12px 16px;
    pointer-events: none;
  }
  .hud a { pointer-events: auto; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: rgba(251,247,240,.1); border: 1px solid rgba(251,247,240,.18); transition: transform .2s, background .2s; }
  .hud a:hover { transform: translateX(-3px); background: rgba(251,247,240,.2); }
  .brand { font: 400 18px/1 var(--f-title); letter-spacing: .03em; }
  .brand span { color: #ff6b81; }
  .stats { margin-left: auto; display: flex; gap: 8px; }
  .stat { background: rgba(251,247,240,.09); border: 1px solid rgba(251,247,240,.16); border-radius: 12px; padding: 7px 11px; text-align: center; min-width: 64px; }
  .stat small { display: block; font: 800 10px/1 var(--f-body); letter-spacing: .12em; opacity: .65; text-transform: uppercase; }
  .stat b { font: 400 18px/1.2 var(--f-title); display: inline-block; }
  .stat b.bump { animation: bump .4s cubic-bezier(.3,1.8,.5,1); }
  @keyframes bump { 40% { transform: scale(1.45); color: #ff6b81; } }
  .reset { pointer-events: auto; border: 0; border-radius: 12px; background: var(--cherry); color: #fff; font: 800 13px/1 var(--f-body); padding: 0 14px; cursor: pointer; transition: transform .15s, filter .2s; }
  .reset:hover { filter: brightness(1.12); } .reset:active { transform: scale(.94); }

  .msg {
    position: fixed; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
    font: 400 clamp(26px, 6vw, 52px)/1 var(--f-title); color: #fff; text-shadow: 0 4px 0 var(--cherry), 0 10px 30px rgba(0,0,0,.5);
    pointer-events: none; white-space: nowrap; transition: transform .45s cubic-bezier(.2,1.6,.3,1), opacity .3s;
  }
  .msg.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

  .help { position: fixed; z-index: 3; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); font: 700 22px/1 'Caveat', cursive; color: rgba(251,247,240,.75); pointer-events: none; white-space: nowrap; transition: opacity .5s; }

  .win {
    position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; background: rgba(27,19,16,.6); backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .4s;
  }
  .win.show { opacity: 1; pointer-events: auto; }
  .card { background: var(--paper); color: var(--ink); border-radius: 22px; padding: 28px 30px; text-align: center; max-width: 340px; transform: translateY(30px) rotate(-2deg); transition: transform .6s cubic-bezier(.2,1.4,.3,1); box-shadow: 0 30px 60px rgba(0,0,0,.4); }
  .win.show .card { transform: none; }
  .card h2 { margin: 0 0 6px; font: 400 30px/1.1 var(--f-title); color: var(--cherry); }
  .card p { margin: 0 0 18px; color: var(--brown); }
  .card .big { font: 400 46px/1 var(--f-title); color: var(--ink); margin: 6px 0 2px; }
  .card button { border: 0; border-radius: 14px; background: var(--ink); color: var(--paper); font: 800 15px/1 var(--f-body); padding: 13px 20px; cursor: pointer; transition: transform .15s; }
  .card button:hover { transform: translateY(-2px); }
  @media (max-width: 560px) { .brand { display: none; } .stat { min-width: 54px; padding: 6px 8px; } }
</style>
</head>
<body>
  <canvas id="c"></canvas>

  <header class="hud">
    <a href="../../#reading" aria-label="Портфолио руу буцах"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fbf7f0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="brand">CHERRY <span>BILLIARDS</span></div>
    <div class="stats">
      <div class="stat"><small>Цохилт</small><b id="shots">0</b></div>
      <div class="stat"><small>Үлдсэн</small><b id="left">15</b></div>
      <div class="stat"><small>Шилдэг</small><b id="best">—</b></div>
      <button class="reset" id="reset" title="Шинээр эхлэх">↻</button>
    </div>
  </header>

  <div class="msg" id="msg"></div>
  <div class="help" id="help">Цагаан бөмбөгнөөс арагш чирээд тавь ➜ цохилт</div>

  <div class="win" id="win">
    <div class="card">
      <h2>Ширээ цэвэрлэгдлээ!</h2>
      <p>15 бөмбөгийг бүгдийг нь халаасалсан</p>
      <div class="big" id="winShots">0</div>
      <p id="winNote">цохилт</p>
      <button id="again">Дахин тоглох ↻</button>
    </div>
  </div>

<script>
/* =====================================================================
   Cherry Billiards — 2D биллиардын физик (Canvas 2D, ямар ч сангүй).
   Ширээний «дотоод» координат: 1000 × 500. Дэлгэцэнд тааруулж томруулна,
   гар утсан дээр (босоо) 90° эргүүлж харуулна.
   ===================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TW = 1000, TH = 500, R = 12.5, RAIL = 46, POCKET = 25;
const FRICTION = 0.9915, STOP = 0.035, SUB = 4;

const pockets = [
  [0, 0], [TW / 2, -6], [TW, 0],
  [0, TH], [TW / 2, TH + 6], [TW, TH],
];
const COLORS = ['#fff', '#f2c14e', '#2f5fb3', '#d6332f', '#6a3fa0', '#f08a24', '#2e8b57', '#7a1f1f', '#151515'];

let balls, shots, potted, aiming = null, moving = false, cueFoul = false, shotPots = 0, startTime;
let view = { s: 1, rot: false, ox: 0, oy: 0 };
let best = +localStorage.getItem('billiards-best') || 0;

/* ---------- Бөмбөг өрөх ---------- */
function rack() {
  balls = [{ n: 0, x: 250, y: TH / 2, vx: 0, vy: 0, in: false }];
  // гурвалжин: 5 эгнээ, 8 нь голд
  const order = [1, 9, 2, 10, 8, 3, 11, 4, 12, 5, 13, 6, 14, 7, 15];
  let i = 0;
  for (let row = 0; row < 5; row++) {
    for (let k = 0; k <= row; k++) {
      balls.push({
        n: order[i++],
        x: 720 + row * R * 1.75,
        y: TH / 2 + (k - row / 2) * R * 2.02,
        vx: 0, vy: 0, in: false, spin: Math.random() * 6,
      });
    }
  }
  shots = 0; potted = []; startTime = performance.now();
  ui();
}

/* ---------- Дэлгэцийн хэмжээ, эргүүлэлт ---------- */
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const availW = innerWidth - 24, availH = innerHeight - 130;
  view.rot = availH > availW * 1.15;              // босоо дэлгэц бол эргүүлнэ
  const fullW = TW + RAIL * 2, fullH = TH + RAIL * 2;
  const [w, h] = view.rot ? [fullH, fullW] : [fullW, fullH];
  view.s = Math.min(availW / w, availH / h) * dpr;
  view.ox = cv.width / 2; view.oy = (innerHeight / 2 + 20) * dpr;
}
function applyView() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(view.ox, view.oy);
  if (view.rot) ctx.rotate(Math.PI / 2);
  ctx.scale(view.s, view.s);
  ctx.translate(-TW / 2, -TH / 2);
}
// дэлгэцийн цэг → ширээний координат (урвуу хувиргалт)
function toTable(cx, cy) {
  applyView();
  const m = ctx.getTransform().invertSelf();
  const dpr = cv.width / innerWidth;
  const p = m.transformPoint(new DOMPoint(cx * dpr, cy * dpr));
  return { x: p.x, y: p.y };
}

/* ---------- Физик ---------- */
function step() {
  for (let s = 0; s < SUB; s++) {
    for (const b of balls) {
      if (b.in) continue;
      b.x += b.vx / SUB; b.y += b.vy / SUB;
      b.spin = (b.spin || 0) + Math.hypot(b.vx, b.vy) / SUB / R;
      // халаас
      for (const [px, py] of pockets) {
        if (Math.hypot(b.x - px, b.y - py) < POCKET) { pot(b); break; }
      }
      if (b.in) continue;
      // хана (халаасны амны хажууд биш үед)
      const nearCorner = (y) => y < POCKET * 1.3 || y > TH - POCKET * 1.3;
      const nearSide = (x) => x < POCKET * 1.3 || x > TW - POCKET * 1.3 || Math.abs(x - TW / 2) < POCKET * 1.1;
      if (b.x < R && !nearCorner(b.y)) { b.x = R; b.vx = -b.vx * 0.8; thud(b.vx); }
      if (b.x > TW - R && !nearCorner(b.y)) { b.x = TW - R; b.vx = -b.vx * 0.8; thud(b.vx); }
      if (b.y < R && !nearSide(b.x)) { b.y = R; b.vy = -b.vy * 0.8; thud(b.vy); }
      if (b.y > TH - R && !nearSide(b.x)) { b.y = TH - R; b.vy = -b.vy * 0.8; thud(b.vy); }
    }
    // бөмбөг хоорондын мөргөлдөөн (ижил масс → нормаль чиглэлийн хурдыг солилцоно)
    for (let i = 0; i < balls.length; i++) {
      const a = balls[i]; if (a.in) continue;
      for (let j = i + 1; j < balls.length; j++) {
        const b = balls[j]; if (b.in) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d > 0 && d < R * 2) {
          const nx = dx / d, ny = dy / d, overlap = R * 2 - d;
          a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
          b.x += nx * overlap / 2; b.y += ny * overlap / 2;
          const rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
          if (rel > 0) {
            const imp = rel * 0.97;
            a.vx -= imp * nx; a.vy -= imp * ny;
            b.vx += imp * nx; b.vy += imp * ny;
            clack(rel);
          }
        }
      }
    }
  }
  moving = false;
  for (const b of balls) {
    if (b.in) continue;
    b.vx *= FRICTION; b.vy *= FRICTION;
    if (Math.hypot(b.vx, b.vy) < STOP) { b.vx = b.vy = 0; } else moving = true;
  }
  if (!moving && wasMoving) settle();
  wasMoving = moving;
}
let wasMoving = false;

function pot(b) {
  b.in = true; b.vx = b.vy = 0;
  drop();
  if (b.n === 0) { cueFoul = true; flash('Цагаан унав! +1'); return; }
  potted.push(b.n); shotPots++;
  ui(true);
}
// бүх бөмбөг зогссоны дараа
function settle() {
  if (shotPots >= 2) flash(shotPots === 2 ? 'ДАБЛ! ✦' : `${shotPots}x КОМБО! ✦✦`);
  else if (shotPots === 1 && !cueFoul) flash(['Гоё! ✿', 'Яг онож!', 'Nice shot!'][Math.random() * 3 | 0]);
  shotPots = 0;
  if (cueFoul) {
    cueFoul = false; shots++;
    const cue = balls[0];
    Object.assign(cue, { in: false, x: 250, y: TH / 2, vx: 0, vy: 0 });
    while (balls.some((b) => b !== cue && !b.in && Math.hypot(b.x - cue.x, b.y - cue.y) < R * 2.2)) cue.y += R;
    ui(true);
  }
  if (potted.length === 15) win();
}

/* ---------- Чиглүүлэх (чирээд тавих) ---------- */
cv.addEventListener('pointerdown', (e) => {
  if (moving || balls[0].in) return;
  cv.setPointerCapture(e.pointerId);
  aiming = { ...toTable(e.clientX, e.clientY) };
  document.getElementById('help').style.opacity = 0;
  ensureAudio();
});
cv.addEventListener('pointermove', (e) => { if (aiming) Object.assign(aiming, toTable(e.clientX, e.clientY)); });
cv.addEventListener('pointerup', () => {
  if (!aiming) return;
  const a = aim();
  aiming = null;
  if (!a || a.power < 0.04) return;
  const cue = balls[0];
  const v = a.power * 26;
  cue.vx = a.dx * v; cue.vy = a.dy * v;
  shots++; ui(true);
  hit(a.power);
});
// цохих чиглэл: цагаан бөмбөгнөөс хуруу руу ЭСРЭГ (харвуул шиг)
function aim() {
  if (!aiming) return null;
  const cue = balls[0];
  const dx = cue.x - aiming.x, dy = cue.y - aiming.y, d = Math.hypot(dx, dy);
  if (d < 4) return null;
  return { dx: dx / d, dy: dy / d, power: Math.min(1, d / 260) };
}

/* ---------- Зурах ---------- */
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  applyView();

  // модон хүрээ
  const wood = ctx.createLinearGradient(0, -RAIL, 0, TH + RAIL);
  wood.addColorStop(0, '#7a4e33'); wood.addColorStop(.5, '#5b3824'); wood.addColorStop(1, '#3e2617');
  ctx.fillStyle = wood;
  round(-RAIL, -RAIL, TW + RAIL * 2, TH + RAIL * 2, 28); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2; ctx.stroke();

  // cherry red даавуу + гэрэлтүүлэг
  const felt = ctx.createRadialGradient(TW / 2, TH / 2, 40, TW / 2, TH / 2, TW * 0.62);
  felt.addColorStop(0, '#c8173a'); felt.addColorStop(1, '#7c0c22');
  ctx.fillStyle = felt;
  ctx.fillRect(-8, -8, TW + 16, TH + 16);
  // толгой шугам
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(250, 0); ctx.lineTo(250, TH); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  [[250, TH / 2], [750, TH / 2]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); });
  // сувдан тэмдэглэгээ (diamonds)
  ctx.fillStyle = '#f3e6cf';
  for (let i = 1; i < 8; i++) if (i !== 4) { dot(i * TW / 8, -RAIL / 2); dot(i * TW / 8, TH + RAIL / 2); }
  for (let i = 1; i < 4; i++) { dot(-RAIL / 2, i * TH / 4); dot(TW + RAIL / 2, i * TH / 4); }
  // халаас
  for (const [px, py] of pockets) {
    ctx.fillStyle = '#120b08'; ctx.beginPath(); ctx.arc(px, py, POCKET, 0, 7); ctx.fill();
    ctx.strokeStyle = '#2a1a12'; ctx.lineWidth = 4; ctx.stroke();
  }

  // чиглүүлэх шугам + «сүнс» бөмбөг
  const a = aim();
  const cue = balls[0];
  if (a && !cue.in) {
    const hitInfo = castRay(cue.x, cue.y, a.dx, a.dy);
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cue.x, cue.y); ctx.lineTo(hitInfo.x, hitInfo.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.arc(hitInfo.x, hitInfo.y, R, 0, 7); ctx.stroke();
    if (hitInfo.ball) { // бай бөмбөг хаашаа явахыг харуулна
      const b = hitInfo.ball, nx = (b.x - hitInfo.x) / (2 * R), ny = (b.y - hitInfo.y) / (2 * R);
      ctx.strokeStyle = 'rgba(255,214,110,.8)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + nx * 90, b.y + ny * 90); ctx.stroke();
    }
  }

  // бөмбөгнүүд
  for (const b of balls) if (!b.in) drawBall(b);

  // цохиур (cue stick)
  if (a && !cue.in) {
    const back = 18 + a.power * 90;
    ctx.save();
    ctx.translate(cue.x, cue.y);
    ctx.rotate(Math.atan2(a.dy, a.dx));
    const g = ctx.createLinearGradient(-back - 420, 0, -back, 0);
    g.addColorStop(0, '#2a1a12'); g.addColorStop(.6, '#c79a6b'); g.addColorStop(.97, '#f3e6cf'); g.addColorStop(1, '#3b6ea5');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-back, -3); ctx.lineTo(-back - 420, -7); ctx.lineTo(-back - 420, 7); ctx.lineTo(-back, 3); ctx.closePath();
    ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 6;
    ctx.fill();
    ctx.restore();
    // хүчний хэмжүүр
    ctx.save();
    ctx.translate(cue.x, cue.y);
    ctx.strokeStyle = `hsl(${120 - a.power * 120}, 80%, 60%)`; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, R + 9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * a.power); ctx.stroke();
    ctx.restore();
  }

  // халаасалсан бөмбөгнүүдийн тавиур
  potted.forEach((n, i) => drawBall({ n, x: 40 + i * (R * 2 + 6), y: TH + RAIL + 26, spin: 0 }, true));
}

function drawBall(b, small) {
  ctx.save();
  ctx.translate(b.x, b.y);
  if (!small) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(3, 4, R, R * .9, 0, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.clip();
  const n = b.n, col = COLORS[n > 8 ? n - 8 : n];
  ctx.fillStyle = n > 8 ? '#fbf7f0' : col;
  ctx.fillRect(-R, -R, R * 2, R * 2);
  if (n > 8) { ctx.fillStyle = col; ctx.fillRect(-R, -R * 0.55, R * 2, R * 1.1); } // судалтай
  if (n > 0) {
    const off = Math.sin(b.spin || 0) * R * 0.35; // эргэлдэх мэт харагдуулна
    ctx.fillStyle = '#fbf7f0'; ctx.beginPath(); ctx.arc(off, 0, R * 0.48, 0, 7); ctx.fill();
    ctx.fillStyle = '#1b1310'; ctx.font = `800 ${R * 0.75}px Nunito, Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n, off, 0.5);
  }
  const sh = ctx.createRadialGradient(-R * .4, -R * .45, 1, 0, 0, R * 1.1);
  sh.addColorStop(0, 'rgba(255,255,255,.75)'); sh.addColorStop(.25, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,.35)');
  ctx.fillStyle = sh; ctx.fillRect(-R, -R, R * 2, R * 2);
  ctx.restore();
}

// чиглэлийн шугам эхний бөмбөг/хананд хаана хүрэхийг тооцоолно
function castRay(x, y, dx, dy) {
  let best = Infinity, ball = null;
  for (const b of balls) {
    if (b.n === 0 || b.in) continue;
    const fx = b.x - x, fy = b.y - y, t = fx * dx + fy * dy;
    if (t <= 0) continue;
    const perp2 = fx * fx + fy * fy - t * t, rr = 4 * R * R;
    if (perp2 > rr) continue;
    const tt = t - Math.sqrt(rr - perp2);
    if (tt < best) { best = tt; ball = b; }
  }
  const tx = dx > 0 ? (TW - R - x) / dx : dx < 0 ? (R - x) / dx : Infinity;
  const ty = dy > 0 ? (TH - R - y) / dy : dy < 0 ? (R - y) / dy : Infinity;
  const tw = Math.min(tx, ty);
  if (tw < best) { best = tw; ball = null; }
  return { x: x + dx * best, y: y + dy * best, ball };
}

const dot = (x, y) => { ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 7); ctx.fill(); };
function round(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

/* ---------- UI ---------- */
const $ = (id) => document.getElementById(id);
function ui(bump) {
  const set = (id, v) => { const el = $(id); if (el.textContent != v) { el.textContent = v; if (bump) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } } };
  set('shots', shots); set('left', 15 - potted.length); set('best', best || '—');
}
let mt;
function flash(t) { const m = $('msg'); m.textContent = t; m.classList.add('show'); clearTimeout(mt); mt = setTimeout(() => m.classList.remove('show'), 1100); }
function win() {
  const record = !best || shots < best;
  if (record) { best = shots; localStorage.setItem('billiards-best', best); }
  $('winShots').textContent = shots;
  $('winNote').textContent = record ? 'цохилт — шинэ дээд амжилт! 🏆' : `цохилт (шилдэг: ${best})`;
  $('win').classList.add('show');
  fanfare();
}
$('again').onclick = () => { $('win').classList.remove('show'); rack(); };
$('reset').onclick = () => { rack(); flash('Шинэ тоглолт'); };

/* ---------- Дуу (Web Audio) ---------- */
let ac;
function ensureAudio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); }
function noise(dur, freq, gain, type = 'bandpass') {
  if (!ac) return;
  const len = ac.sampleRate * dur, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 4;
  const s = ac.createBufferSource(); s.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = ac.createGain(); g.gain.value = gain;
  s.connect(f).connect(g).connect(ac.destination); s.start();
}
let lastClack = 0;
function clack(v) { const t = performance.now(); if (t - lastClack < 25) return; lastClack = t; noise(0.04, 3200, Math.min(0.9, v / 10)); }
function thud(v) { if (Math.abs(v) > 0.8) noise(0.08, 220, Math.min(0.5, Math.abs(v) / 18), 'lowpass'); }
function hit(p) { noise(0.05, 1800, 0.25 + p * 0.5); }
function drop() { noise(0.18, 140, 0.6, 'lowpass'); }
function fanfare() {
  if (!ac) return;
  [523, 659, 784, 1047].forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * .12;
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + .5);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .55);
  });
}

/* ---------- Давталт ---------- */
function loop() { step(); draw(); requestAnimationFrame(loop); }
addEventListener('resize', resize);
resize(); rack(); loop();
</script>
